<style>
  :root{
    --pink-pale:   #fdf1f4;
    --pink-soft:   #f7d3de;
    --pink-mid:    #ec9ec4ff;
    --rose-deep:   #b23a63;
    --plum-ink:    #3a2430;
    --white:       #ffffff;
    --gold:        #cda15a;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    font-family:'Jost', sans-serif;
    color:var(--plum-ink);
    background:var(--white);
    overflow-x:hidden;
  }
  h1,h2,h3, .display{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    letter-spacing:0.01em;
  }
  a{ color:inherit; text-decoration:none; }
  img{ max-width:100%; display:block; }
  .container{ max-width:1120px; margin:0 auto; padding:0 24px; }
  .eyebrow{
    font-family:'Jost',sans-serif;
    font-size:12.5px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--rose-deep);
    font-weight:500;
  }

  /* ===== NAV ===== */
  nav{
    position:sticky; top:0; z-index:50;
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--pink-soft);
  }
  .nav-inner{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px; max-width:1120px; margin:0 auto;
  }
  .brand{ font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:600; color:var(--rose-deep); }
  .brand span{ color:var(--gold); }
  .nav-links{ display:flex; gap:32px; font-size:14.5px; letter-spacing:0.02em; }
  .nav-links a{ position:relative; padding-bottom:4px; transition:color .3s; }
  .nav-links a:hover{ color:var(--rose-deep); }
  .nav-links a.active{ color:var(--rose-deep); font-weight: 500; } /* Active link style */
  .nav-cta{
    background:var(--rose-deep); color:var(--white); padding:10px 22px;
    border-radius:999px; font-size:13.5px; letter-spacing:0.03em; font-weight:500;
    transition:background .2s;
  }
  .nav-cta:hover{ background:var(--plum-ink); }
  .nav-toggle{ display:none; background:none; border:none; font-size:26px; color:var(--rose-deep); cursor:pointer; }

  /* Mobile Nav Menu (hidden by default) */
  .nav-menu-mobile{
    display:none;
    position:absolute; top:100%; left:0; right:0;
    background:var(--white);
    border-bottom:1px solid var(--pink-soft);
    padding:10px 32px 24px;
    flex-direction:column;
    gap:18px;
    text-align:center;
    box-shadow:0 10px 20px -10px rgba(178,58,99,0.1);
  }
  .nav-menu-mobile.open{ display:flex; }
  .nav-menu-mobile a{ font-size:15px; font-weight:500; }
  .nav-menu-mobile .nav-cta{ margin-top:8px; }

  /* ===== PAGE HEADER ===== */
  .page-header {
    padding: 64px 0;
    text-align: center;
    background: linear-gradient(180deg, var(--pink-pale) 0%, var(--white) 100%);
  }
  .page-header h1 {
    font-size: 48px;
  }

  /* ===== SECTION SHELL ===== */
  section{ padding:96px 0; }
  .section-head{ max-width:640px; margin-bottom:48px; }
  .section-head h2{ font-size:38px; margin-top:10px; }

  /* ===== GALLERY ===== */
  .gallery{ background:var(--white); padding-top: 0; }
  .gallery-grid{
    perspective: 1200px;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    grid-auto-rows:150px;
    gap:14px;
  }
  .gallery-grid a{ border-radius:14px; overflow:hidden; display:block; transition: transform 0.4s, box-shadow 0.4s; }
  .gallery-grid img{ width:100%; height:100%; object-fit:cover; transition:transform .5s, filter .5s; }
  .gallery-grid a:hover{ transform:translateZ(40px); box-shadow: 0 20px 40px -10px rgba(58,36,48,0.4); }
  .gallery-grid a:hover img{ transform:scale(1.1); filter:brightness(1.05); }
  .g-tall{ grid-row:span 2; }
  .g-wide{ grid-column:span 2; }

  footer{ padding:36px 24px; text-align:center; font-size:13px; color:#9a8790; }
  footer a{ color:var(--rose-deep); }

  @media (max-width:860px){
    .nav-inner{ padding:16px 24px; }
    .nav-links{ display:none; }
    .nav-cta{ display:none; }
    .nav-toggle{ display:block; }
    .gallery-grid{ grid-template-columns:repeat(2,1fr); }
    .g-wide{ grid-column:span 2; }
  }

  @media (max-width: 500px){
    .container{ padding: 0 20px; }
    section{ padding: 80px 0; }
    .page-header { padding: 48px 0; }
    .page-header h1 { font-size: 38px; }
    .gallery-grid{ grid-template-columns: 1fr; grid-auto-rows: 250px; }
  }
</style>
